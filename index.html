<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#fff7ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<title>赤ちゃん表情おみくじ</title>
<link rel="stylesheet" href="./style.css?v=12">
<link rel="stylesheet" href="./deluxe.css?v=12">
<style>
body:not(.show-score-details) .scoreChip,
body:not(.show-score-details) .scoreDetails,
body:not(.show-score-details) #analysisStatus{display:none!important}
body:not(.show-fortune-map) #grid .fchip{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
  <div class="heroMark" aria-hidden="true">🎴</div>
  <div class="heroText">
    <div class="heroTopline"><span class="eyebrow">BABY MOMENTS</span><span class="versionBadge">v12</span></div>
    <h1>赤ちゃん表情おみくじ</h1>
    <p class="heroCatch">かわいい一瞬を、おみくじに。</p>
    <p class="lead">動画を選ぶだけで、印象的な表情を自動で切り出して赤ちゃんおみくじを作ります。</p>
  </div>
</header>
<section class="card">
  <div class="step">CREATE</div>
  <h2>新しいおみくじを作る</h2>
  <div class="filebox">
    <input id="fileInput" type="file" accept="video/*">
    <div class="note">動画を選ぶと自動で表情コマを抽出します。処理はブラウザ内だけで行い、元動画は外部へ送信しません。</div>
  </div>
  <div id="progressWrap"><div class="progress"><div id="progressBar"></div></div><div id="progressText">準備中...</div></div>
  <details class="opt">
    <summary>詳細オプション</summary>
    <div class="row" style="margin-bottom:10px">
      <label for="frameCount">抽出枚数</label>
      <select id="frameCount">
        <option value="auto" selected>おまかせ（12〜28枚）</option>
        <option value="8">8枚</option><option value="10">10枚</option><option value="12">12枚</option><option value="14">14枚</option><option value="16">16枚</option><option value="18">18枚</option><option value="20">20枚</option><option value="24">24枚</option><option value="28">28枚</option><option value="32">32枚</option>
      </select>
    </div>
    <label class="toggle"><span><b style="display:block;margin-bottom:3px">通常ルーレットにする</b><span class="note">ONにすると、運勢なしの表情ルーレットとして作ります。通常はOFFのままでOKです。</span></span><input id="plainMode" type="checkbox"></label>
    <label class="toggle" style="margin-top:10px"><span><b style="display:block;margin-bottom:3px">豪華演出モード</b><span class="note">ONにすると、結果札・光・粒子・効果音などの演出を運勢ごとに豪華にします。通常はOFFです。</span></span><input id="deluxeMode" type="checkbox"></label>
    <label class="toggle" style="margin-top:10px"><span><b style="display:block;margin-bottom:3px">表情度を表示する</b><span class="note">表情度は赤ちゃんの良し悪しではなく、この動画の中で写真の表情や見た目がどれだけ特徴的かを示す相対値です。ONにすると「くっきり・珍しさ・変化」の内訳も表示します。</span></span><input id="showScores" type="checkbox"></label>
    <label class="toggle" style="margin-top:10px"><span><b style="display:block;margin-bottom:3px">運勢の割り当てを表示する</b><span class="note">ONにすると、プレビュー写真ごとの「大吉・吉・凶」などを先に確認できます。通常は隠したまま遊べます。</span></span><input id="showFortunes" type="checkbox"></label>
  </details>
</section>
<section id="previewSection" class="card" style="display:none">
  <div class="step">PREVIEW</div><h2 id="previewTitle">自動で作成したおみくじ</h2>
  <div id="analysisStatus" class="note analysisStatus" style="display:none"></div><div id="grid" class="grid"></div>
  <div class="row" style="margin-top:13px"><button id="playBtn" class="primary">この内容で遊ぶ</button><button id="reextractBtn" class="secondary">もう一度抽出する</button></div>
  <div class="note" id="previewNote" style="margin-top:8px">保存名は自動で付けます。必要なら保存後に変更できます。</div>
</section>
<section class="card"><div class="step">SAVED</div><h2>保存したルーレット</h2><div id="library"><div class="note">まだ保存されていません。</div></div></section>
<section id="playSection" class="card">
  <div class="step">PLAY</div>
  <div class="playShell"><div id="stage"><img id="playImage" alt=""><div id="fortuneBadge"></div><div id="resultCard"><div id="resultHead">きょうの運勢</div><div id="resultText"></div><div id="message"></div></div><div id="rouletteBadge">タップでストップ</div></div></div>
  <div id="tapHint">画像をタップすると止まります</div><div class="row" style="justify-content:center;margin-top:12px"><button id="backBtn" class="secondary">戻る</button></div>
</section>
<video id="video" playsinline muted preload="metadata" style="display:none"></video><canvas id="captureCanvas" style="display:none"></canvas><canvas id="smallCanvas" width="28" height="28" style="display:none"></canvas>
</div>
<div id="bigOverlay"><div id="bigText">大吉！</div></div>
<script src="./app.js?v=12" defer></script>
<script src="./deluxe.js?v=12" defer></script>
<script>
(()=>{
  const scoreBox=document.getElementById('showScores');
  const fortuneBox=document.getElementById('showFortunes');
  const grid=document.getElementById('grid');
  const status=document.getElementById('analysisStatus');
  const sync=()=>{
    document.body.classList.toggle('show-score-details',!!scoreBox?.checked);
    document.body.classList.toggle('show-fortune-map',!!fortuneBox?.checked);
  };
  const rename=()=>{
    document.querySelectorAll('.scoreChip').forEach(el=>{el.textContent=el.textContent.replace(/^魅力度/,'表情度');});
    if(status)status.textContent=status.textContent.replace(/魅力度/g,'表情度');
  };
  scoreBox?.addEventListener('change',sync);fortuneBox?.addEventListener('change',sync);
  if(grid)new MutationObserver(rename).observe(grid,{childList:true,subtree:true});
  if(status)new MutationObserver(rename).observe(status,{childList:true,subtree:true,characterData:true});
  sync();rename();
})();
</script>
</body>
</html>
